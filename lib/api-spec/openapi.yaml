openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API per il portale di orientamento universitario di Sofia
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Orientamento e prenotazioni pubbliche
  - name: admin
    description: Accesso e gestione delle richieste
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /courses:
    get:
      operationId: listCourses
      tags: [public]
      summary: Elenco dei corsi di laurea
      parameters:
        - name: university
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Corsi disponibili
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /orientation-requests:
    post:
      operationId: createOrientationRequest
      tags: [public]
      summary: Invia una richiesta di orientamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrientationRequestInput"
      responses:
        "201":
          description: Richiesta registrata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrientationRequestReceipt"
  /tour-slots:
    get:
      operationId: listTourSlots
      tags: [public]
      summary: Elenca gli orari disponibili per una data
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Fasce orarie, con disponibilità
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TourSlot"
  /appointment-slots:
    get:
      operationId: listAppointmentSlots
      tags: [public]
      summary: Elenca gli orari liberi per consulenze e tour
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Slot orari con disponibilità condivisa nel calendario di Sofia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentSlot"
  /tour-bookings:
    post:
      operationId: createTourBooking
      tags: [public]
      summary: Prenota un tour della piattaforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourBookingInput"
      responses:
        "201":
          description: Prenotazione registrata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourBookingReceipt"
  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Verifica configurazione e sessione amministrativa
      responses:
        "200":
          description: Stato di accesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /admin/setup:
    post:
      operationId: setupAdmin
      tags: [admin]
      summary: Crea il primo account amministratore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "201":
          description: Account creato e sessione avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Accede all'area amministrativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Accesso effettuato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /admin/logout:
    post:
      operationId: logoutAdmin
      tags: [admin]
      summary: Chiude la sessione amministrativa
      responses:
        "200":
          description: Sessione chiusa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Riepilogo delle richieste
      responses:
        "200":
          description: Totali e appuntamenti prossimi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/orientation-requests:
    get:
      operationId: listAdminOrientationRequests
      tags: [admin]
      summary: Elenca le richieste di orientamento
      responses:
        "200":
          description: Richieste in ordine cronologico inverso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrientationRequest"
  /admin/tour-bookings:
    get:
      operationId: listAdminTourBookings
      tags: [admin]
      summary: Elenca le prenotazioni dei tour
      responses:
        "200":
          description: Prenotazioni in ordine cronologico
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TourBooking"
  /admin/tour-bookings/{id}:
    patch:
      operationId: updateTourBookingStatus
      tags: [admin]
      summary: Modifica lo stato di una prenotazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourBookingStatusInput"
      responses:
        "200":
          description: Prenotazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourBooking"
  /admin/orientation-requests/{id}/management:
    patch:
      operationId: updateOrientationRequestManagement
      tags: [admin]
      summary: Aggiorna stato, note e promemoria di una richiesta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrientationManagementUpdate"
      responses:
        "200":
          description: Richiesta aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrientationRequest"
  /admin/orientation-requests/{id}/confirm-enrollment:
    post:
      operationId: confirmOrientationEnrollment
      tags: [admin]
      summary: Registra un'iscrizione e conferma la provvigione incassata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Iscrizione e provvigione registrate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "404":
          description: Richiesta non trovata
        "409":
          description: Esiste già un'iscrizione collegata alla richiesta
  /admin/orientation-requests/{id}/mark-not-enrolled:
    post:
      operationId: markOrientationRequestNotEnrolled
      tags: [admin]
      summary: Segna una richiesta come non iscritta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Esito di iscrizione aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrientationRequest"
        "404":
          description: Richiesta non trovata
        "409":
          description: La richiesta ha già un'iscrizione registrata
  /admin/tour-bookings/{id}/management:
    patch:
      operationId: updateTourBookingManagement
      tags: [admin]
      summary: Aggiorna note e promemoria di un tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourManagementUpdate"
      responses:
        "200":
          description: Tour aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourBooking"
  /admin/enrollments:
    get:
      operationId: listAdminEnrollments
      tags: [admin]
      summary: Elenca iscrizioni e provvigioni
      responses:
        "200":
          description: Iscrizioni in ordine cronologico inverso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
    post:
      operationId: createAdminEnrollment
      tags: [admin]
      summary: Registra un'iscrizione universitaria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Iscrizione registrata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
  /admin/enrollments/{id}:
    patch:
      operationId: updateAdminEnrollment
      tags: [admin]
      summary: Aggiorna provvigione e stato di un'iscrizione
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentUpdate"
      responses:
        "200":
          description: Iscrizione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
  /admin/email-settings:
    get:
      operationId: getAdminEmailSettings
      tags: [admin]
      summary: Legge la configurazione delle email automatiche
      responses:
        "200":
          description: Mittente e tipi di conferma attivi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
    put:
      operationId: updateAdminEmailSettings
      tags: [admin]
      summary: Configura le email automatiche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsInput"
      responses:
        "200":
          description: Configurazione salvata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
  /admin/email-settings/test:
    post:
      operationId: sendAdminTestEmail
      tags: [admin]
      summary: Invia un'email di prova
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailInput"
      responses:
        "200":
          description: Esito dell'invio di prova
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailActionResult"
        "503":
          description: Servizio o mittente non configurato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailActionResult"
  /admin/orientation-requests/{id}/send-confirmation:
    post:
      operationId: resendOrientationConfirmation
      tags: [admin]
      summary: Reinvia la conferma di una richiesta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Esito dell'invio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailActionResult"
        "503":
          description: Invio non riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailActionResult"
  /admin/orientation-requests/{id}/appointment:
    delete:
      operationId: cancelOrientationAppointment
      tags: [admin]
      summary: Annulla l'appuntamento e libera l'orario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Appuntamento annullato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          description: Appuntamento non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Impossibile aggiornare l'evento nel calendario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/tour-bookings/{id}/send-confirmation:
    post:
      operationId: resendTourConfirmation
      tags: [admin]
      summary: Reinvia la conferma di un tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Esito dell'invio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailActionResult"
        "503":
          description: Invio non riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailActionResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Course:
      type: object
      properties:
        id: { type: string }
        university: { type: string }
        category: { type: string }
        name: { type: string }
        duration: { type: string }
      required: [id, university, category, name, duration]
    ContactInput:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        province: { type: string, minLength: 2, maxLength: 60 }
        phone: { type: string, minLength: 6, maxLength: 30 }
      required: [firstName, lastName, email, province, phone]
    OrientationRequestInput:
      allOf:
        - $ref: "#/components/schemas/ContactInput"
        - type: object
          properties:
            university: { type: string, minLength: 1 }
            courseId: { type: string, minLength: 1 }
            date: { type: string, format: date }
            time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
          required: [university, courseId, date, time]
    OrientationRequest:
      allOf:
        - $ref: "#/components/schemas/ContactInput"
        - type: object
          properties:
            id: { type: integer }
            university: { type: string }
            courseId: { type: string }
            courseName: { type: string }
            appointmentDate: { type: ["string", "null"], format: date }
            appointmentTime: { type: ["string", "null"] }
            appointmentStatus: { type: ["string", "null"], enum: [pending, confirmed, cancelled, null] }
            meetUrl: { type: ["string", "null"], format: uri }
            createdAt: { type: string, format: date-time }
            pipelineStatus: { $ref: "#/components/schemas/OrientationPipelineStatus" }
            enrollmentOutcome: { $ref: "#/components/schemas/EnrollmentOutcome" }
            adminNotes: { type: string }
            followUpAt: { type: ["string", "null"], format: date-time }
            confirmationEmailStatus: { $ref: "#/components/schemas/ConfirmationEmailStatus" }
            confirmationEmailSentAt: { type: ["string", "null"], format: date-time }
            confirmationEmailError: { type: string }
          required: [id, university, courseId, courseName, appointmentDate, appointmentTime, appointmentStatus, meetUrl, createdAt, pipelineStatus, enrollmentOutcome, adminNotes, followUpAt, confirmationEmailStatus, confirmationEmailSentAt, confirmationEmailError]
    OrientationRequestReceipt:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        time: { type: string }
        meetUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        confirmationEmailStatus: { $ref: "#/components/schemas/ConfirmationEmailStatus" }
      required: [id, date, time, meetUrl, createdAt, confirmationEmailStatus]
    TourBookingInput:
      allOf:
        - $ref: "#/components/schemas/ContactInput"
        - type: object
          properties:
            date: { type: string, format: date }
            time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
          required: [date, time]
    TourBooking:
      allOf:
        - $ref: "#/components/schemas/ContactInput"
        - type: object
          properties:
            id: { type: integer }
            date: { type: string, format: date }
            time: { type: string }
            meetUrl: { type: ["string", "null"], format: uri }
            status: { type: string, enum: [confirmed, cancelled, completed] }
            createdAt: { type: string, format: date-time }
            adminNotes: { type: string }
            followUpAt: { type: ["string", "null"], format: date-time }
            confirmationEmailStatus: { $ref: "#/components/schemas/ConfirmationEmailStatus" }
            confirmationEmailSentAt: { type: ["string", "null"], format: date-time }
            confirmationEmailError: { type: string }
          required: [id, date, time, meetUrl, status, createdAt, adminNotes, followUpAt, confirmationEmailStatus, confirmationEmailSentAt, confirmationEmailError]
    TourBookingReceipt:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        time: { type: string }
        meetUrl: { type: string, format: uri }
        confirmationEmailStatus: { $ref: "#/components/schemas/ConfirmationEmailStatus" }
      required: [id, date, time, meetUrl, confirmationEmailStatus]
    TourSlot:
      type: object
      properties:
        time: { type: string }
        available: { type: boolean }
      required: [time, available]
    AppointmentSlot:
      type: object
      properties:
        time: { type: string }
        available: { type: boolean }
      required: [time, available]
    AdminCredentials:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 80 }
        password: { type: string, minLength: 10, maxLength: 128 }
      required: [username, password]
    AdminStatus:
      type: object
      properties:
        setupComplete: { type: boolean }
        authenticated: { type: boolean }
      required: [setupComplete, authenticated]
    AdminSummary:
      type: object
      properties:
        orientationRequests: { type: integer }
        tourBookings: { type: integer }
        upcomingBookings: { type: integer }
        enrollmentsTotal: { type: integer }
        commissionsPendingCents: { type: integer }
        commissionsPaidCents: { type: integer }
        followUpsDue: { type: integer }
        nextBooking:
          oneOf:
            - $ref: "#/components/schemas/TourBooking"
            - type: "null"
      required: [orientationRequests, tourBookings, upcomingBookings, enrollmentsTotal, commissionsPendingCents, commissionsPaidCents, followUpsDue, nextBooking]
    OrientationPipelineStatus:
      type: string
      enum: [new, contacted, considering, enrolled, closed]
    EnrollmentOutcome:
      type: string
      enum: [pending, enrolled, not_enrolled]
    ConfirmationEmailStatus:
      type: string
      enum: [sent, failed, not_configured, disabled]
    OrientationManagementUpdate:
      type: object
      properties:
        pipelineStatus: { $ref: "#/components/schemas/OrientationPipelineStatus" }
        adminNotes: { type: string, maxLength: 5000 }
        followUpAt: { type: ["string", "null"], format: date-time }
    TourManagementUpdate:
      type: object
      properties:
        adminNotes: { type: string, maxLength: 5000 }
        followUpAt: { type: ["string", "null"], format: date-time }
    Enrollment:
      type: object
      properties:
        id: { type: integer }
        orientationRequestId: { type: ["integer", "null"] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        university: { type: string }
        courseId: { type: string }
        courseName: { type: string }
        enrolledAt: { type: string, format: date }
        commissionCents: { type: integer, minimum: 0 }
        commissionStatus: { type: string, enum: [pending, paid] }
        commissionPaidAt: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [active, withdrawn] }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, orientationRequestId, firstName, lastName, email, university, courseId, courseName, enrolledAt, commissionCents, commissionStatus, commissionPaidAt, status, notes, createdAt]
    EnrollmentInput:
      type: object
      properties:
        orientationRequestId: { type: ["integer", "null"] }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        university: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        enrolledAt: { type: string, format: date }
        commissionCents: { type: integer, minimum: 0, maximum: 100000000 }
        commissionStatus: { type: string, enum: [pending, paid] }
        notes: { type: string, maxLength: 5000 }
      required: [firstName, lastName, email, university, courseId, enrolledAt, commissionCents, commissionStatus]
    EnrollmentUpdate:
      type: object
      properties:
        commissionCents: { type: integer, minimum: 0, maximum: 100000000 }
        commissionStatus: { type: string, enum: [pending, paid] }
        status: { type: string, enum: [active, withdrawn] }
        notes: { type: string, maxLength: 5000 }
    EmailSettings:
      type: object
      properties:
        senderEmail: { type: ["string", "null"] }
        senderName: { type: string }
        sendOrientationConfirmations: { type: boolean }
        sendTourConfirmations: { type: boolean }
      required: [senderEmail, senderName, sendOrientationConfirmations, sendTourConfirmations]
    EmailSettingsInput:
      type: object
      properties:
        senderEmail: { type: ["string", "null"] }
        senderName: { type: string, minLength: 1, maxLength: 80 }
        sendOrientationConfirmations: { type: boolean }
        sendTourConfirmations: { type: boolean }
      required: [senderEmail, senderName, sendOrientationConfirmations, sendTourConfirmations]
    TestEmailInput:
      type: object
      properties:
        to: { type: string, format: email, maxLength: 254 }
      required: [to]
    EmailActionResult:
      type: object
      properties:
        success: { type: boolean }
        status: { $ref: "#/components/schemas/ConfirmationEmailStatus" }
        message: { type: string }
      required: [success, status, message]
    TourBookingStatusInput:
      type: object
      properties:
        status: { type: string, enum: [confirmed, cancelled, completed] }
      required: [status]
    Success:
      type: object
      properties:
        success: { type: boolean }
      required: [success]
